name: Nightly Dependency Update

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily
  workflow_dispatch:       # Allow manual trigger
  pull_request:            # Exercise the workflow on any PR that changes it, so a bad edit fails
    paths:                 # on the PR instead of at 3 AM after merge (dependency PRs are skipped)
      - .github/workflows/nightly-deps.yml
      - .github/dependabot.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  update-go-deps:
    name: Update Go Dependencies
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'  # keep in step with bridge/go.mod and bridge/Dockerfile
          check-latest: true
          cache-dependency-path: bridge/go.sum

      - name: Update Go dependencies
        working-directory: bridge
        run: |
          go get -u ./...
          go mod tidy

      - name: Build and test
        working-directory: bridge
        run: |
          CGO_ENABLED=1 go build -o /tmp/whatsapp-bridge .
          go vet ./...
          go test ./...

      - name: Check for changes
        id: go-changes
        working-directory: bridge
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR for Go deps
        if: github.event_name != 'pull_request' && steps.go-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true   # commit via the GitHub API so it shows as Verified
          author: Asim Zeeshan <asim@techbytes.pk>
          committer: Asim Zeeshan <asim@techbytes.pk>
          commit-message: "chore(deps): update Go dependencies"
          title: "chore(deps): nightly Go dependency update"
          body: |
            Automated nightly update of Go dependencies.

            - `go get -u ./...` + `go mod tidy`
            - Build: passing
            - Vet: passing
            - Tests: passing
          branch: deps/go-nightly
          delete-branch: true
          labels: dependencies

  update-python-deps:
    name: Update Python Dependencies
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Each project locks with uv.lock and its Dockerfile installs with `uv sync --frozen`,
        # so the job upgrades uv.lock and validates it exactly the way the image does.
        include:
          - project: mcp-server
            package: whatsapp_mcp
            sync-args: ""
          - project: dashboard
            package: whatsapp_dashboard
            sync-args: "--extra postgres"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'  # keep in step with the python:3.13-slim Docker images

      - name: Upgrade uv.lock
        working-directory: ${{ matrix.project }}
        run: uv lock --upgrade

      - name: Install from the lockfile and import-check (same as the Dockerfile)
        working-directory: ${{ matrix.project }}
        run: |
          uv sync --frozen --no-dev ${{ matrix.sync-args }}
          uv run --frozen python -c "import ${{ matrix.package }}"

      - name: Check for changes
        id: py-changes
        run: |
          if git diff --quiet -- "${{ matrix.project }}/uv.lock"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR for Python deps
        if: github.event_name != 'pull_request' && steps.py-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true   # commit via the GitHub API so it shows as Verified
          author: Asim Zeeshan <asim@techbytes.pk>
          committer: Asim Zeeshan <asim@techbytes.pk>
          add-paths: ${{ matrix.project }}/uv.lock
          commit-message: "chore(deps): update ${{ matrix.project }} Python dependencies"
          title: "chore(deps): nightly Python dependency update (${{ matrix.project }})"
          body: |
            Automated nightly update of `${{ matrix.project }}` Python dependencies.

            - `uv lock --upgrade`
            - `uv sync --frozen --no-dev ${{ matrix.sync-args }}` (same as the Dockerfile): passing
            - Import check of `${{ matrix.package }}`: passing
          branch: deps/python-${{ matrix.project }}-nightly
          delete-branch: true
          labels: dependencies
